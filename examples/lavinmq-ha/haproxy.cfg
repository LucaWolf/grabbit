global
    log stdout format raw local0
    maxconn 4096

defaults
    log     global
    mode    tcp
    option  tcplog
    option  dontlognull
    timeout connect 5s
    timeout client  1m
    timeout server  1m

# ===========================
# AMQP Load Balancing (5672)
# ===========================
frontend amqp_frontend
    bind *:5672
    default_backend lavinmq_amqp

backend lavinmq_amqp
    balance roundrobin
    option tcp-check
    # Check AMQP port
    tcp-check connect port 5672
    server lavinmq1 192.168.44.101:5672 check inter 2s fall 3 rise 2
    server lavinmq2 192.168.44.102:5672 check inter 2s fall 3 rise 2
    server lavinmq3 192.168.44.103:5672 check inter 2s fall 3 rise 2

# ===========================
# Optional: HAProxy Stats UI
# ===========================
listen stats
    bind *:9000
    mode http
    stats enable
    stats uri /
    stats refresh 5s
